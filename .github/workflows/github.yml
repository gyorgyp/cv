name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Run test
        run: echo "CV code-test has been passed succesfully!"
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist   # Vite - default output directory

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  html_to_pdf:
    runs-on: ubuntu-latest

    steps:
    - name: Download source
      uses: actions/checkout@v4

    - name: HTML to PDF by Puppeteer /PDF Action/
      uses: ferdinandkeller/html-to-pdf-action@v1
      with:
        html_file: "index.html"
        output_pdf: "CV_Peter_GYORGY.pdf"

    - name: Upload PDF to GitHub as artifact
      uses: actions/upload-artifact@v4
      with:
        name: CV-PDF-Version
        path: CV_Peter_GYORGY.pdf
