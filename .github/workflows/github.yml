name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  schedule:  
    - cron: '10 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Must be set for both "npm run build" and "npm run preview" (PDF step),
      # otherwise preview serves from / and the /cv/ assets 404, giving a blank PDF.
      VITE_BASE: /cv/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Set actual version number
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          EVENT_LABEL=""
                    
          if [ "${{ github.event_name }}" == "schedule" ]; then
            EVENT_LABEL=": Scheduled"
          fi
          
          FULL_VERSION="v${PKG_VERSION} - #${{ github.run_number }}${EVENT_LABEL}"
          echo "VITE_APP_VERSION=$FULL_VERSION" >> $GITHUB_ENV

      - name: Build
        run: npm run build

      - name: Generate PDF
        run: |
          npm install --no-save --package-lock=false puppeteer

          npm run preview -- --host 127.0.0.1 --port 3000 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/cv/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:3000/cv/ > /dev/null

          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer';

          const browser = await puppeteer.launch({
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox'],
          });

          try {
            const page = await browser.newPage();
            await page.goto('http://127.0.0.1:3000/cv/', { waitUntil: 'networkidle2' });
            // Fail the build instead of publishing a blank PDF if the app did not render.
            await page.waitForSelector('.cv-entry', { timeout: 15000 });
            await page.pdf({
              path: 'dist/CV_Peter_GYORGY.pdf',
              format: 'A4',
              printBackground: true,
            });
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CV-PDF-Version
          path: dist/CV_Peter_GYORGY.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
