name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  schedule:  
    - cron: '10 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Must be set for both "npm run build" and "npm run preview" (PDF step),
      # otherwise preview serves from / and the /cv/ assets 404, giving a blank PDF.
      VITE_BASE: /cv/
      # GitHub Pages has no API of its own: load the live CV from the Azure Static Web App.
      # Needs the CORS header in api/src/functions/getCv.js; falls back to src/assets/cvData.js if unreachable.
      VITE_CV_API_URL: https://zealous-bay-03ae5da0f.4.azurestaticapps.net/api/cv
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Set actual version number
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          EVENT_LABEL=""
                    
          if [ "${{ github.event_name }}" == "schedule" ]; then
            EVENT_LABEL=": Scheduled"
          fi
          
          FULL_VERSION="v${PKG_VERSION} - #${{ github.run_number }}${EVENT_LABEL}"
          echo "VITE_APP_VERSION=$FULL_VERSION" >> $GITHUB_ENV

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
