name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  schedule:  
    - cron: '10 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Run test
        run: echo "CV code-test has been passed succesfully!"
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist   # Vite - default output directory

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  html_to_pdf:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
    - name: Download source
      uses: actions/checkout@v4
      
    - name: Convert HTML to PDF via Puppeteer Script and min. Node.js       
      run: |
          npm install
          npm run build
          
          # Start a local server
          npx serve -s dist -l 3000 &
          
          sleep 3
      
          PUPPETEER_SKIP_DOWNLOAD=true
          npm install puppeteer
          
          # Create a small javascript file for work
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ 
              headless: true, 
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-setuid-sandbox'] 
            });
            
            const page = await browser.newPage();
            
            console.log('Loading page...');
            await page.goto('http://localhost:3000', { waitUntil: 'networkidle2' });
            
            // Waiting 3 sec for safety reasons
            await new Promise(resolve => setTimeout(resolve, 3000));
            
            console.log('PDF generating...');
            await page.pdf({ path: 'CV_Peter_GYORGY.pdf', format: 'A4', printBackground: true });
            
            await browser.close();
            console.log('Done!');
          })();
          "
          
    - name: Upload PDF to GitHub as artifact
      uses: actions/upload-artifact@v4
      with:
        name: CV-PDF-Version
        path: CV_Peter_GYORGY.pdf
