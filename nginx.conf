server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Real files only: never fall back to index.html for a missing PDF,
    # otherwise the "Download as PDF" link saves an HTML page named *.pdf.
    location ~* \.pdf$ {
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        # add_header in a location replaces the server-level headers, so repeat them here.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
